; Compile-only nRF52840 GhostWave core probe. This generic board target does
; not define either device's bootloader, pinout, radio, GPS, or storage.
; Its output MUST NOT be flashed to a device.
[env:nrf52840_compile_probe]
platform = nordicnrf52@10.6.0
board = adafruit_feather_nrf52840
framework = arduino
lib_extra_dirs = ../mcu/lib
lib_deps = ghostwave_core
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
