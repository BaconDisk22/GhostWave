; Ridgeline node firmware for ESP32-S3 LoRa dev boards (Arduino + RadioLib).
; The portable core (../core) and Monocypher (../third_party) are pulled in as
; local libraries via lib/*/library.json, so nothing is copied.
;
;   pio run                          build every env
;   pio run -e heltec_v3 -t upload   flash one board
;   pio device monitor               115200 baud CLI

[platformio]
default_envs = heltec_wireless_tracker_v2, heltec_v3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
  jgromes/RadioLib@7.8.1
  ridgeline_core
  monocypher
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DRADIOLIB_EXCLUDE_LORAWAN=1

[env:heltec_wireless_tracker_v2]
; The Tracker V2 has no board definition in platform-espressif32, so this uses
; the generic ESP32-S3 module with the Tracker's 8 MB flash and native USB CDC
; (same settings as Meshtastic's boards/heltec_wireless_tracker_v2.json).
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DRL_BOARD_TRACKER_V2=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:heltec_v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DRL_BOARD_HELTEC_V3=1
